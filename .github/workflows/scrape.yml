name: Refresh OPW listings

on:
  schedule:
    # Every 6 hours: 02:17, 08:17, 14:17, 20:17 Malaysia time (cron is UTC). The odd minute avoids the
    # top-of-the-hour queue, when GitHub most often delays scheduled runs.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:            # "Run workflow" button on the Actions tab
    inputs:
      kind:
        description: "Only refresh jobs or plantations (blank = both)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: opw-listings
  cancel-in-progress: false

jobs:
  scrape:
    # Uses GitHub's cloud runner. If property sites start blocking it (see the run summary), register a
    # self-hosted runner on an office machine and set the repository variable RUNNER to: self-hosted
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scrape
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            python -m scraper.run --kind "${{ github.event.inputs.kind }}"
          else
            python -m scraper.run
          fi

      - name: Run summary
        if: always()
        run: python -m scraper.summary >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name  "opw-listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest && python -m pytest -q tests
